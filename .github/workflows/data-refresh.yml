name: data-refresh

on:
  schedule:
    - cron: '0 0 1,15 * *'   # 매월 1일·15일 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-oecd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest file id from data.go.kr
        id: meta
        run: |
          set -e
          JSON=$(curl -sL -A "Mozilla/5.0" "https://www.data.go.kr/tcs/dss/selectFileDataDownload.do?publicDataPk=3078608&publicDataDetailPk=uddi:d0a38f3b-fd67-4807-a45a-9cea84dad0e2")
          ATCH=$(echo "$JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('atchFileId',''))")
          FNAME=$(echo "$JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('fileDataRegistVO',{}).get('orginlFileNm',''))")
          if [ -z "$ATCH" ]; then echo "atchFileId 확인 실패 — 중단(부분 저장 없음)"; exit 1; fi
          echo "atch=$ATCH" >> "$GITHUB_OUTPUT"
          echo "fname=$FNAME" >> "$GITHUB_OUTPUT"

      - name: Download and validate CSV
        run: |
          set -e
          curl -sL -A "Mozilla/5.0" "https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=${{ steps.meta.outputs.atch }}&fileDetailSn=1" -o raw.csv
          iconv -f cp949 -t utf-8 raw.csv > new.csv 2>/dev/null || iconv -f utf-8 -t utf-8 raw.csv > new.csv
          HEAD=$(head -1 new.csv)
          ROWS=$(wc -l < new.csv)
          echo "header: $HEAD / rows: $ROWS"
          case "$HEAD" in *국가명*) : ;; *) echo "필수 컬럼(국가명) 불일치 — 커밋하지 않고 실패 처리"; exit 1;; esac
          if [ "$ROWS" -lt 150 ]; then echo "행 수 부족($ROWS) — 커밋하지 않고 실패 처리"; exit 1; fi

      - name: Derive dataVersion from source filename
        id: ver
        run: |
          set -e
          V=$(echo "${{ steps.meta.outputs.fname }}" | grep -oE '[0-9]{6}' | tail -1)
          if [ -n "$V" ]; then DV="20${V:0:2}-${V:2:2}-${V:4:2}"; else DV=$(date -u +%F); fi
          echo "dv=$DV" >> "$GITHUB_OUTPUT"

      - name: Commit only if changed
        run: |
          set -e
          if cmp -s new.csv data/oecd_country_grade.csv; then
            echo "변경 없음 — 커밋 생략 (메타의 fetchedAt만 갱신)"
          fi
          cp new.csv data/oecd_country_grade.csv
          printf '{"dataVersion":"%s","fetchedAt":"%s","source":"data.go.kr 3078608 (K-SURE OECD 국가등급)"}\n' "${{ steps.ver.outputs.dv }}" "$(date -u +%FT%TZ)" > data/oecd_meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oecd_country_grade.csv data/oecd_meta.json
          if git diff --cached --quiet; then echo "커밋할 변경 없음"; exit 0; fi
          git commit -m "data: OECD 등급 갱신 $(date -u +%F)"
          git push
